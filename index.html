<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Courses | GJIMT</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:linear-gradient(-45deg,#1e3c72,#2a5298,#ff6b6b,#ff9ff3);
  background-size:400% 400%;
  animation:bgMove 10s ease infinite;
  min-height:100vh;
  color:#fff;
}

@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* 🔥 HIGHLIGHTED HOME BUTTON */
.home-btn{
  position:fixed;
  top:20px;
  left:20px;
  padding:12px 26px;
  background:linear-gradient(45deg,#ff6b6b,#feca57);
  border-radius:30px;
  text-decoration:none;
  color:#fff;
  font-weight:700;
  font-size:1rem;
  letter-spacing:0.5px;
  box-shadow:0 0 20px rgba(255,255,255,0.6),
             0 10px 25px rgba(0,0,0,0.3);
  transition:0.3s;
}

.home-btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 30px rgba(255,255,255,0.9),
             0 15px 35px rgba(0,0,0,0.4);
}

/* HEADER */
header{
  text-align:center;
  padding:80px 20px 30px;
}

header h1{
  font-size:3.3rem;
  text-shadow:0 5px 20px rgba(0,0,0,0.4);
}

header p{
  margin-top:10px;
  font-size:1.2rem;
  opacity:0.9;
}

/* GRID */
.courses{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:30px;
  max-width:950px;
  margin:40px auto;
}

/* CARD */
.course{
  background:rgba(255,255,255,0.15);
  padding:45px 20px;
  border-radius:25px;
  text-align:center;
  cursor:pointer;
  backdrop-filter:blur(15px);
  transition:0.5s;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.course:hover{
  transform:translateY(-12px) scale(1.07);
  background:rgba(255,255,255,0.3);
  box-shadow:0 20px 60px rgba(255,255,255,0.4);
}

.course h2{
  font-size:2rem;
}

/* POPUP */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(8px);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:0.4s;
}

.popup.active{
  opacity:1;
  pointer-events:auto;
}

/* POPUP BOX */
.popup-content{
  background:linear-gradient(135deg,#ffffff,#f1f5ff);
  color:#333;
  padding:45px 30px;
  border-radius:25px;
  text-align:center;
  width:340px;
  transform:scale(0.7);
  transition:0.4s;
}

.popup.active .popup-content{
  transform:scale(1);
}

/* TITLE */
.popup-content h3{
  margin-bottom:25px;
  font-size:1.6rem;
}

/* BUTTONS */
.option-btn{
  display:block;
  width:100%;
  margin:12px 0;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(45deg,#2a5298,#ff6b6b);
  color:#fff;
  font-size:1.1rem;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

.option-btn:hover{
  transform:scale(1.05);
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* CLOSE */
.close{
  margin-top:15px;
  cursor:pointer;
  color:#ff4d4d;
  font-weight:bold;
}

/* RESPONSIVE */
@media(max-width:700px){
  .courses{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<!-- 🔥 UPDATED HOME BUTTON -->
<a href="https://gjimtmicrosite.github.io/Integrated/" class="home-btn">🏠 Back To Main Page</a>

<header>
  <h1>Choose Your Course</h1>
  <p>Select your professional pathway</p>
</header>

<div class="courses">

  <div class="course" onclick="handleCourse('ACCA')"><h2>ACCA</h2></div>
  <div class="course" onclick="handleCourse('ca')"><h2>CA</h2></div>
  <div class="course" onclick="handleCourse('cpa')"><h2>CPA</h2></div>
  <div class="course" onclick="#"><h2>CFA</h2></div>
  <div class="course" onclick="#"><h2>CAPM</h2></div>
  <div class="course" onclick="#"><h2>PMP</h2></div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h3>Choose Your Entry Level</h3>

    <button class="option-btn" onclick="goToPage('plus2')">Under Graduate</button>
    <button class="option-btn" onclick="goToPage('graduation')">Graduation</button>

    <div class="close" onclick="closePopup()">Close</div>
  </div>
</div>

<script>
function handleCourse(course){
  if(course === "ACCA"){
    document.getElementById("popup").classList.add("active");
  } else {
    window.location.href = course + ".html";
  }
}

function closePopup(){
  document.getElementById("popup").classList.remove("active");
}

function goToPage(type){
  if(type === "plus2"){
    window.location.href = "ACCA_plus2.html";
  } else {
    window.location.href = "ACCA_graduation.html";
  }
}
</script>

</body>
</html>
