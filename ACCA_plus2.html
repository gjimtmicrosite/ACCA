<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCA Programs</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#0f2027;
  color:#fff;
  overflow-x:hidden;
}

/* 3D ANIMATED BACKGROUND */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  top:-50%;
  left:-50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,81,47,0.3), transparent 40%),
             radial-gradient(circle at 70% 70%, rgba(29,151,108,0.3), transparent 40%),
             radial-gradient(circle at 50% 50%, rgba(221,36,118,0.2), transparent 50%);
  animation:moveBg 15s linear infinite;
  z-index:-1;
}

@keyframes moveBg{
  0%{transform:rotate(0deg) scale(1);} 
  50%{transform:rotate(180deg) scale(1.2);} 
  100%{transform:rotate(360deg) scale(1);} 
}

.container{
  padding:40px;
  text-align:center;
}

.home-btn{
  position:absolute;
  top:20px;
  left:20px;
  padding:10px 18px;
  background:linear-gradient(135deg,#ff512f,#dd2476);
  border:none;
  border-radius:10px;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
  transition:0.3s;
}

.home-btn:hover{
  transform:scale(1.05);
}

h1{
  margin-bottom:60px;
}

.cards{
  display:flex;
  justify-content:center;
  gap:80px;
  flex-wrap:wrap;
}

.card{
  width:300px;
  height:380px;
  perspective:1000px;
}

.card-inner{
  position:relative;
  width:100%;
  height:100%;
  transition:transform 0.8s;
  transform-style:preserve-3d;
}

.card:hover .card-inner{
  transform:rotateY(180deg);
}

.card-front, .card-back{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:20px;
  box-shadow:0 15px 35px rgba(0,0,0,0.4);
  padding:20px;
}

.card-front{
  background:linear-gradient(135deg,#ff512f,#dd2476);
}

.card-back{
  background:linear-gradient(135deg,#1d976c,#93f9b9);
  transform:rotateY(180deg);
}

.sub-links{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.sub-links a{
  text-decoration:none;
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,0.2);
  color:#fff;
  transition:0.3s;
}

.sub-links a:hover{
  background:#fff;
  color:#000;
}

.detail{
  display:none;
  padding:40px;
  text-align:center;
}

.back-btn{
  margin-top:20px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#ff512f;
  color:#fff;
  cursor:pointer;
}

</style>
</head>

<body>

<button class="home-btn" onclick="goHome()">Home</button>

<div class="container" id="mainPage">
  <h1>ACCA Integrated Programs</h1>

  <div class="cards">

    <div class="card">
      <div class="card-inner">
        <div class="card-front">
          <h2>BBA + ACCA</h2>
          <p>Professional business degree with global accounting certification.</p>
        </div>
        <div class="card-back">
          <h3>Explore</h3>
          <div class="sub-links">
            <a href="framework.html">ACCA Framework</a>
            <a href="bbamodule.html">Modules</a>
            <a href="fee.html" onclick="openDetail('bba-fees')">Fee Structure</a>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-inner">
        <div class="card-front">
          <h2>B.Com + ACCA</h2>
          <p>Commerce degree with international accounting excellence.</p>
        </div>
        <div class="card-back">
          <h3>Explore</h3>
          <div class="sub-links">
            <a href="B.coframework.html" onclick="openDetail('bcom-framework')">ACCA Framework</a>
            <a href="B.commodule.html" onclick="openDetail('bcom-modules')">Modules</a>
            <a href="B.comfee.html" onclick="openDetail('bcom-fees')">Fee Structure</a>
              <a href="gjimtacca.html" onclick="openDetail('bcom-fees')">GJIMT Fee Structure</a>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="detail" id="detailPage">
  <h2 id="detailTitle"></h2>
  <p id="detailContent"></p>
  <button class="back-btn" onclick="goBack()">Back</button>
</div>

<script>
function goHome(){
  window.location.href = "https://gjimtmicrosite.github.io/ACCA/";
}

function openDetail(type){
  document.getElementById('mainPage').style.display='none';
  document.getElementById('detailPage').style.display='block';

  let title = '';
  let content = '';

  if(type === 'bba-framework'){
    title = 'BBA + ACCA Framework';
    content = 'Detailed ACCA framework for BBA students including Applied Knowledge, Skills, and Professional levels.';
  }

  if(type === 'bba-modules'){
    title = 'BBA + ACCA Modules';
    content = 'Modules include Business Technology, Financial Accounting, Corporate Law, Performance Management, and more.';
  }

  if(type === 'bba-fees'){
    title = 'BBA + ACCA Fee Structure';
    content = 'Comprehensive fee details including tuition, exam fees, and registration charges.';
  }

  if(type === 'bcom-framework'){
    title = 'B.Com + ACCA Framework';
    content = 'Structured ACCA pathway integrated with commerce fundamentals.';
  }

  if(type === 'bcom-modules'){
    title = 'B.Com + ACCA Modules';
    content = 'Includes Financial Reporting, Taxation, Audit, and Strategic Business Leader.';
  }

  if(type === 'bcom-fees'){
    title = 'B.Com + ACCA Fee Structure';
    content = 'Detailed breakdown of fees for entire program duration.';
  }

  document.getElementById('detailTitle').innerText = title;
  document.getElementById('detailContent').innerText = content;
}

function goBack(){
  document.getElementById('mainPage').style.display='block';
  document.getElementById('detailPage').style.display='none';
}
</script>

</body>
</html>
