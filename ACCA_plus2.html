<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCA Programs</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#0f2027;
  color:#fff;
  overflow-x:hidden;
}

/* ANIMATED BACKGROUND */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  top:-50%;
  left:-50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,81,47,0.3), transparent 40%),
             radial-gradient(circle at 70% 70%, rgba(29,151,108,0.3), transparent 40%),
             radial-gradient(circle at 50% 50%, rgba(221,36,118,0.2), transparent 50%);
  animation:moveBg 15s linear infinite;
  z-index:-1;
}

@keyframes moveBg{
  0%{transform:rotate(0deg) scale(1);} 
  50%{transform:rotate(180deg) scale(1.2);} 
  100%{transform:rotate(360deg) scale(1);} 
}

.container{
  padding:40px;
  text-align:center;
}

.home-btn{
  position:absolute;
  top:20px;
  left:20px;
  padding:10px 18px;
  background:linear-gradient(135deg,#ff512f,#dd2476);
  border:none;
  border-radius:10px;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

h1{
  margin-bottom:50px;
}

/* NEW CARD DESIGN */
.cards{
  display:flex;
  justify-content:center;
  gap:40px;
  flex-wrap:wrap;
}

.card{
  width:320px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:25px;
  box-shadow:0 15px 35px rgba(0,0,0,0.4);
  transition:0.4s;
  text-align:left;
}

.card:hover{
  transform:translateY(-10px);
}

.card h2{
  margin-bottom:10px;
}

.card p{
  font-size:14px;
  opacity:0.85;
}

.explore-btn{
  margin-top:15px;
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:linear-gradient(135deg,#ff512f,#dd2476);
  color:white;
  cursor:pointer;
  font-weight:600;
}

.sub-links{
  margin-top:15px;
  display:none;
  flex-direction:column;
  gap:10px;
}

.sub-links a{
  text-decoration:none;
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,0.15);
  color:#fff;
  transition:0.3s;
}

.sub-links a:hover{
  background:#fff;
  color:#000;
}

</style>
</head>

<body>

<button class="home-btn" onclick="goHome()">🏠 Home</button>

<div class="container">
  <h1>ACCA Integrated Programs</h1>

  <div class="cards">

    <!-- BBA -->
    <div class="card">
      <h2>BBA + ACCA</h2>
      <p>Professional business degree with global accounting certification.</p>

      <button class="explore-btn" onclick="toggleLinks('bbaLinks')">Explore</button>

      <div class="sub-links" id="bbaLinks">
        <a href="framework.html">ACCA Framework</a>
        <a href="bbamodule.html">Modules</a>
        <a href="fee.html">Fee Structure</a>
      </div>
    </div>

    <!-- BCOM -->
    <div class="card">
      <h2>B.Com + ACCA</h2>
      <p>Commerce degree with international accounting excellence.</p>

      <button class="explore-btn" onclick="toggleLinks('bcomLinks')">Explore</button>

      <div class="sub-links" id="bcomLinks">
        <a href="B.coframework.html">ACCA Framework</a>
        <a href="B.commodule.html">Modules</a>
        <a href="B.comfee.html">Fee Structure</a>
        <a href="gjimtacca.html">GJIMT Fee Structure</a>
      </div>
    </div>

  </div>
</div>

<script>
function goHome(){
  window.location.href = "https://gjimtmicrosite.github.io/Integrated/";
}

function toggleLinks(id){
  let section = document.getElementById(id);

  if(section.style.display === "flex"){
    section.style.display = "none";
  } else {
    section.style.display = "flex";
  }
}
</script>

</body>
</html>
